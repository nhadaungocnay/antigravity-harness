        // Slugify logic
        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a"); 
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e"); 
            str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i"); 
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o"); 
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u"); 
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y"); 
            str = str.replace(/đ/g,"d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|MỠ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, "");
            str = str.replace(/\u02C6|\u0306|\u031B/g, "");
            str = str.replace(/ + /g," ");
            str = str.trim();
            str = str.replace(/!|@|%|\^|\*|\(|\)|\+|\=|\<|\>|\?|\/|,|\.|\:|\;|\'|\"|\&|\#|\[|\]|~|\$|_|`|-|{|}|\||\\/g," ");
            return str;
        }

        function generateSlug(str) {
            return removeVietnameseTones(str).toLowerCase().replace(/\s+/g, '-');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('projName').value;
            const path = document.getElementById('projPath').value.replace(/\\/g, '/');
            const desc = document.getElementById('projDesc').value;
            const scale = document.getElementById('projScale').value;
            const type = document.getElementById('projType').value;
            
            const slug = generateSlug(name) || 'new-project';
            const osType = document.getElementById('osSelect').value;
            
            let content = "";
            if (osType === 'cmd') {
                const winPath = path.replace(/\//g, '\\');
                content = `@echo off\n`;
                content += `mkdir "${winPath}\\${slug}" 2>nul\n`;
                content += `cd /d "${winPath}\\${slug}"\n`;
                content += `echo Domain: ${type} > prompt.txt\n`;
                content += `echo Scale: ${scale} >> prompt.txt\n`;
                content += `echo Desc: ${desc} >> prompt.txt\n`;
                content += `echo =======================================\n`;
                content += `echo Project Folder Created: ${winPath}\\${slug}\n`;
                content += `echo Please open Antigravity IDE here and run:\n`;
                content += `echo /harness read prompt.txt and build architecture\n`;
                content += `echo =======================================\n`;
                content += `agy\n`;
                content += `pause\n`;
            } else {
                content = `#!/bin/bash\n`;
                content += `mkdir -p "${path}/${slug}"\n`;
                content += `cd "${path}/${slug}"\n`;
                content += `cat << 'EOF_PROMPT' > prompt.txt\nDomain: ${type}\nScale: ${scale}\nDesc: ${desc}\nEOF_PROMPT\n`;
                content += `echo "======================================="\n`;
                content += `echo "Project Folder Created: ${path}/${slug}"\n`;
                content += `echo "Please open Antigravity IDE here and run:"\n`;
                content += `echo "/harness read prompt.txt and build architecture"\n`;
                content += `echo "======================================="\n`;
                content += `agy\n`;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kickoff_${slug}.${osType}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            closeModal();
            showToast();
        }

        function showToast() {
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function copyCommand(id) {
            const command = `/harness pull ${id}`;
            navigator.clipboard.writeText(command).then(() => showToast());
        }

        function renderFilters() {
            filtersContainer.innerHTML = categories.map(cat => `
                <button onclick="setFilter('${cat}')" 
                    class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap 
                    ${currentFilter === cat ? 'bg-dark-accent text-dark-bg' : 'bg-dark-card text-slate-400 hover:text-white border border-slate-700 hover:border-slate-500'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setFilter(cat) {
            currentFilter = cat;
            renderFilters();
            renderGrid();
        }

        function renderGrid() {
            const query = searchInput.value.toLowerCase();
            const filtered = templates.filter(t => 
                (currentFilter === 'All' || t.category === currentFilter) &&
                (t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query) || t.id.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No templates found.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(t => `
                <div class="glass rounded-xl p-6 hover:-translate-y-1 transition-transform duration-300 group cursor-pointer" onclick="copyCommand('${t.id}')">
                    <div class="text-xs font-semibold text-dark-accent mb-2 uppercase tracking-wider">${t.category}</div>
                    <h3 class="text-xl font-bold text-white mb-2 group-hover:text-dark-accent transition-colors">${t.name}</h3>
                    <p class="text-slate-400 text-sm mb-6 line-clamp-3">${t.desc}</p>
                    
                    <div class="mt-auto">
                        <div class="bg-black/40 rounded p-3 flex justify-between items-center group-hover:bg-black/60 transition-colors">
                            <code class="text-sm text-green-400 font-mono truncate mr-2">/harness pull ${t.id}</code>
                            <i class="fas fa-copy text-slate-500 group-hover:text-white transition-colors"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', renderGrid);

        // Initialize
        renderFilters();
        renderGrid();
    </script>
</body>
</html>
