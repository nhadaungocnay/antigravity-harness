<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Harness Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast {
            transition: opacity 0.3s, transform 0.3s;
        }
    </style>
</head>
<body class="bg-dark-bg text-slate-300 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold text-white mb-4 tracking-tight">Antigravity <span class="text-dark-accent">Harness Catalog</span></h1>
            <p class="text-xl text-slate-400 max-w-2xl mx-auto">Browse 100+ production-grade agent team templates. Click to copy the install command and run it in your terminal.</p>
        </header>

        <!-- Search and Filter -->
        <div class="mb-12 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-1/3">
                <i class="fas fa-search absolute left-4 top-3.5 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="Search templates..." class="w-full bg-dark-card border border-slate-700 rounded-full py-2.5 pl-12 pr-4 text-white focus:outline-none focus:border-dark-accent transition-colors">
            </div>
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2" id="categoryFilters">
                <!-- Filters generated by JS -->
            </div>
        </div>

        <!-- Grid -->
        <div id="catalogGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards generated by JS -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-dark-accent text-dark-bg px-6 py-3 rounded-lg shadow-lg opacity-0 transform translate-y-4 pointer-events-none font-bold">
        Command copied to clipboard!
    </div>

    <script>
        // Sample dataset (expandable)
        const templates = [
            { id: '01-youtube-production', name: 'YouTube Production', category: 'Content Creation', desc: 'Agent team for script writing, SEO optimization, and thumbnail ideation.' },
            { id: '02-podcast-creation', name: 'Podcast Creation', category: 'Content Creation', desc: 'Team for researching topics, writing show notes, and editing audio transcripts.' },
            { id: '16-fullstack-dev', name: 'Full-Stack Developer Team', category: 'Software Dev', desc: 'Frontend, backend, and QA agents working together on web projects.' },
            { id: '17-api-design', name: 'API Design Council', category: 'Software Dev', desc: 'Architects and security reviewers for REST/GraphQL API specs.' },
            { id: '31-ml-experiment', name: 'ML Experimentation', category: 'Data & AI', desc: 'Data scientist and hyperparameter tuning agents.' },
            { id: '43-startup-strategy', name: 'Startup Strategy', category: 'Business', desc: 'Market researcher, financial modeler, and pitch deck reviewer.' },
            { id: '66-contract-review', name: 'Contract Review', category: 'Legal', desc: 'Legal agents focused on risk assessment and compliance.' },
            { id: '89-hiring-process', name: 'Hiring & Onboarding', category: 'Operations', desc: 'HR agents for screening resumes and preparing interview plans.' },
            // Add more later...
        ];

        const categories = ['All', ...new Set(templates.map(t => t.category))];
        let currentFilter = 'All';

        const grid = document.getElementById('catalogGrid');
        const filtersContainer = document.getElementById('categoryFilters');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');

        function showToast() {
            toast.classList.remove('opacity-0', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        function copyCommand(id) {
            const command = `/harness pull ${id}`;
            navigator.clipboard.writeText(command).then(() => showToast());
        }

        function renderFilters() {
            filtersContainer.innerHTML = categories.map(cat => `
                <button onclick="setFilter('${cat}')" 
                    class="px-4 py-1.5 rounded-full text-sm font-medium transition-colors whitespace-nowrap 
                    ${currentFilter === cat ? 'bg-dark-accent text-dark-bg' : 'bg-dark-card text-slate-400 hover:text-white border border-slate-700 hover:border-slate-500'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setFilter(cat) {
            currentFilter = cat;
            renderFilters();
            renderGrid();
        }

        function renderGrid() {
            const query = searchInput.value.toLowerCase();
            const filtered = templates.filter(t => 
                (currentFilter === 'All' || t.category === currentFilter) &&
                (t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query) || t.id.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No templates found.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(t => `
                <div class="glass rounded-xl p-6 hover:-translate-y-1 transition-transform duration-300 group cursor-pointer" onclick="copyCommand('${t.id}')">
                    <div class="text-xs font-semibold text-dark-accent mb-2 uppercase tracking-wider">${t.category}</div>
                    <h3 class="text-xl font-bold text-white mb-2 group-hover:text-dark-accent transition-colors">${t.name}</h3>
                    <p class="text-slate-400 text-sm mb-6 line-clamp-3">${t.desc}</p>
                    
                    <div class="mt-auto">
                        <div class="bg-black/40 rounded p-3 flex justify-between items-center group-hover:bg-black/60 transition-colors">
                            <code class="text-sm text-green-400 font-mono truncate mr-2">/harness pull ${t.id}</code>
                            <i class="fas fa-copy text-slate-500 group-hover:text-white transition-colors"></i>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        searchInput.addEventListener('input', renderGrid);

        // Initialize
        renderFilters();
        renderGrid();
    </script>
</body>
</html>
